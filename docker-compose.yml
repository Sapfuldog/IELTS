services:
  bot:
    build: .
    image: ielts-prep-bot
    container_name: ielts-bot
    restart: unless-stopped

    # Reads BOT_TOKEN and the optional settings. Create it first:
    #   cp .env.example .env   (then paste your @BotFather token)
    env_file: .env

    volumes:
      - ielts-data:/app/data     # SQLite database (progress, users)
      - ielts-media:/app/media   # cached text-to-speech audio

    # Give the polling loop a moment to shut down cleanly on `docker compose down`.
    stop_grace_period: 20s

    # Without this, a long-running bot's logs grow without bound.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ielts-data:
  ielts-media:
